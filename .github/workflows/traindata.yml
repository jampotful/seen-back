name: traindata
# Training photos (records through the species list's cutoff) and iNaturalist's own names, built from GBIF.
# Start it by pushing a commit to a branch named run/traindata/<anything>. The data go to the branch
# pub/data-alachua beside the species list and the evaluation manifest; the summary and log come back on ci.
on:
  push:
    branches: ['run/traindata/**']
permissions:
  contents: write
concurrency:
  group: traindata-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build, check and publish
        run: bash ci/data/train.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh traindata out
