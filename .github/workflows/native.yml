name: native
# A thin native shell around the built page, built and run on build machines. Push a commit to run/native/<label>:
#  - android: ci/native/android_build.sh makes a debug APK (a WebView activity that serves the bundled page from its assets),
#    then ci/native/android_emu.sh runs it in an Android emulator: the opening screen, the page's self-test with the pocket
#    recognizer, and Begin with the emulator's camera
#  - ios: ci/native/ios.sh compiles a WKWebView app for the iPhone simulator (unsigned, ad hoc), bundles the page into it, and runs
#    the same self-test in an iPhone simulator
# run/native/android<anything> runs only the Android job, run/native/ios<anything> only the iOS job; any other label runs both.
# Results come back on the `ci` branch under runs/native/<run number>-android and -ios: logs, screenshots as JPEG, logcat lines,
# and what the page reported about itself.
on:
  push:
    branches: ['run/native/**']
permissions:
  contents: write
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: ${{ !startsWith(github.ref_name, 'run/native/ios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: the page and a debug APK
        run: bash ci/native/android_build.sh
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: the APK in an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash ci/native/android_emu.sh
      - name: shrink pictures
        if: always()
        run: python3 -m pip install -q pillow && python3 -I ci/engines/shrink.py out; du -sh out
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh native out android
  ios:
    if: ${{ !startsWith(github.ref_name, 'run/native/android') }}
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the page in a WKWebView app on an iPhone simulator
        run: bash ci/native/ios.sh
      - name: shrink pictures
        if: always()
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q pillow && /tmp/venv/bin/python -I ci/engines/shrink.py out; du -sh out
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh native out ios
