name: eval
# The evaluation, rerun from the published branches on a clean build machine.
# Start it by pushing a commit to a branch named run/eval/<anything>. On the ci branch, under runs/eval/<run number>/,
# come back: the studies' JSON files and docs/EVAL.md as this machine wrote them, compare.txt (how they differ from
# the files committed in the pushed commit), and the log. The exported heads go to branches pub/heads-<train>-<model>.
on:
  push:
    branches: ['run/eval/**']
permissions:
  contents: write
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: evaluate
        run: bash ci/eval/run.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh eval out
