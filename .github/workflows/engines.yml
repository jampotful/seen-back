name: engines
# The picture engine and the recognizer inside the page, on every browser engine. Push a commit to run/engines/<label>:
#  - linux (two jobs: chromium; firefox-webkit): test/rec/check_rec.js on the stand-in and on a real slot, and the page's self-test
#    (index.html?selftest=1) with its recognizer phase; Firefox headed on Xvfb (headless Firefox has no WebGL on these machines)
#  - macos: the same in Playwright's WebKit, then the self-test in real Safari (safaridriver) and in Safari on an iPhone simulator
# Push to run/engines/live (or run/engines/live-<anything>) instead to check only the live address, https://jampotful.github.io/seen-back/;
# push to run/engines/mac-<anything> to run only the macOS job, or to run/engines/linux-<anything> for only the Linux jobs.
# run/engines/mac-39<anything>: the macOS job runs only the self-test with the shipped slot (models/pocket) in WebKit, Safari and the simulator;
# run/engines/mac-thr<anything> and run/engines/linux-thr<anything>: only the threads experiment (ci/engines/threads.sh), which every
# other macOS-less Linux run also does at its end.
# run/engines/big-<anything>: the larger model from the live address (ci/engines/big.sh, test/engines/big.js): one Linux job (Chromium with the
# home-screen questions, Firefox, WebKit) and two macOS jobs (Playwright's WebKit and real Safari; Safari on an iPhone simulator).
# run/engines/bigwm-<anything>: the larger model's memory, page against page (ci/engines/bigwm.sh, the pages in ci/engines/wm-variants.txt):
# WebKit on Linux, and Playwright's WebKit and Safari on macOS (no simulator).
# run/engines/ffx-<anything>: the recognizer's runtime alone in Firefox (ci/engines/ffbench.sh, test/engines/ffbench.js), one variant a job.
# Results come back on the `ci` branch under runs/engines/<run number>-<job>: log.txt, summary.json, reports and small JPEGs.
on:
  push:
    branches: ['run/engines/**']
permissions:
  contents: write
concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    if: ${{ !startsWith(github.ref_name, 'run/engines/live') && !startsWith(github.ref_name, 'run/engines/mac') && !startsWith(github.ref_name, 'run/engines/big') && !startsWith(github.ref_name, 'run/engines/ffx') }}
    strategy:
      fail-fast: false
      matrix:
        part: [chromium, firefox-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: recognizer and self-test in ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: bash ci/engines/linux.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh engines out linux-${{ matrix.part }}
  macos:
    if: ${{ !startsWith(github.ref_name, 'run/engines/live') && !startsWith(github.ref_name, 'run/engines/linux') && !startsWith(github.ref_name, 'run/engines/big') && !startsWith(github.ref_name, 'run/engines/ffx') }}
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: recognizer and self-test in WebKit, Safari and an iPhone simulator
        run: bash ci/engines/macos.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh engines out macos
  live:
    if: ${{ startsWith(github.ref_name, 'run/engines/live') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: the live address in Chromium, Firefox and WebKit
        run: bash ci/engines/live.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh engines out live
  big-linux:
    if: ${{ startsWith(github.ref_name, 'run/engines/big') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: the larger model from the live address in Chromium, Firefox and WebKit
        env:
          PART: linux
        run: bash ci/engines/big.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh engines out big-linux
  big-mac:
    if: ${{ startsWith(github.ref_name, 'run/engines/big') && !startsWith(github.ref_name, 'run/engines/big-lx') }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON((startsWith(github.ref_name, 'run/engines/big-wk') || startsWith(github.ref_name, 'run/engines/bigwm')) && '["mac-ws"]' || '["mac-ws", "mac-sim"]') }}
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: the larger model from the live address in ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: bash ci/engines/big.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh engines out big-${{ matrix.part }}
  ffx:
    if: ${{ startsWith(github.ref_name, 'run/engines/ffx') }}
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(startsWith(github.ref_name, 'run/engines/ffx-v') && '["vers", "vers-pw"]' || startsWith(github.ref_name, 'run/engines/ffx-s') && '["same-1", "same-2", "same-3"]' || startsWith(github.ref_name, 'run/engines/ffx-g') && '["ff-page", "ff-pagepw"]' || startsWith(github.ref_name, 'run/engines/ffx-p') && '["ff-plain", "ff-plainpw", "ff-pwopt"]' || '["ff-default", "ff-headed", "ff-ion", "ff-base", "ff-lazy", "ff-opt", "ff-wb", "ff-coi", "chromium"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: the runtime alone, ${{ matrix.v }}
        env:
          V: ${{ matrix.v }}
        run: bash ci/engines/ffbench.sh
      - name: return results
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash ci/return.sh engines out ffx-${{ matrix.v }}
