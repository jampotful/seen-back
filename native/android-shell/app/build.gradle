plugins {
    id 'com.android.application'
}

android {
    namespace 'org.seenback.shell'
    compileSdk 35

    defaultConfig {
        applicationId 'org.seenback.shell'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
